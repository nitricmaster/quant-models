# Runs after the A-share close every weekday and commits the refreshed figures.
name: daily-update

on:
  schedule:
    - cron: "30 8 * * 1-5"      # 08:30 UTC = 16:30 Beijing, Mon-Fri
  workflow_dispatch:             # adds a "Run workflow" button for manual runs

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run all stages
        run: python run_daily.py
        continue-on-error: true   # still commit whatever succeeded
        env:
          # Example holdings only. Keep real numbers out of a public repository.
          SHARES: "1000"
          CASH: "100000"
          RATE: "0.011"
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add latest reports README.md
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%F)"
          git push
